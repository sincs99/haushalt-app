name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install pytest httpx

      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend (locales, typecheck, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check locales
        run: npm run check:locales

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  # Eigener Job ohne `needs`: läuft parallel und blockiert die Test-Jobs nicht.
  # Ein roter Audit bedeutet "neue Advisory" — Befunde werden in
  # docs/security/hardening-review.md bewertet, nicht blind hochgezogen.
  dependency-audit:
    name: Dependency audit (pip-audit, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pip-audit
        run: pip install pip-audit

      - name: pip-audit (backend/requirements.txt)
        id: pip_audit
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt --desc on

      - name: npm audit (frontend, runtime deps, high+)
        id: npm_audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Fail if any audit found vulnerabilities
        if: steps.pip_audit.outcome == 'failure' || steps.npm_audit.outcome == 'failure'
        run: |
          echo "pip-audit: ${{ steps.pip_audit.outcome }}"
          echo "npm audit: ${{ steps.npm_audit.outcome }}"
          exit 1
