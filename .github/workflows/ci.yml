name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test and lint dependencies
        run: pip install pytest httpx pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests with coverage
        run: pytest -q --cov=app --cov-report=term

  # Echte PostgreSQL-DB: Migrationen (hoch + eine zurück + wieder hoch) und die
  # pg-Lane (tests/pg/: Races, Locks, Drift-Check Modelle ↔ Migrationen).
  backend-postgres:
    name: Backend (PostgreSQL 16, alembic, pytest -m pg)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: casa
          POSTGRES_PASSWORD: casa
          POSTGRES_DB: casa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://casa:casa@localhost:5432/casa
      # Admin-URL: die pg-Lane legt pro Lauf eine eigene Wegwerf-DB an
      TEST_PG_URL: postgresql://casa:casa@localhost:5432/postgres
      JWT_SECRET_KEY: ci-only-secret-key-for-tests-min-32-chars-xyz
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Migrate fresh database (alembic upgrade head)
        run: alembic upgrade head

      - name: PostgreSQL test lane (pytest -m pg)
        run: pytest -m pg -q

      - name: Downgrade one revision and upgrade again
        run: alembic downgrade -1 && alembic upgrade head

  frontend:
    name: Frontend (locales, typecheck, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check locales
        run: npm run check:locales

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

  # Eigener Job ohne `needs`: läuft parallel und blockiert die Test-Jobs nicht.
  # Ein roter Audit bedeutet "neue Advisory" — Befunde werden in
  # docs/security/hardening-review.md bewertet, nicht blind hochgezogen.
  dependency-audit:
    name: Dependency audit (pip-audit, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pip-audit
        run: pip install pip-audit

      - name: pip-audit (backend/requirements.txt)
        id: pip_audit
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt --desc on

      - name: npm audit (frontend, runtime deps, high+)
        id: npm_audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Fail if any audit found vulnerabilities
        if: steps.pip_audit.outcome == 'failure' || steps.npm_audit.outcome == 'failure'
        run: |
          echo "pip-audit: ${{ steps.pip_audit.outcome }}"
          echo "npm audit: ${{ steps.npm_audit.outcome }}"
          exit 1
