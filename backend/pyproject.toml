[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    # Zeilenlänge: bestehender Code nutzt lange Zeilen (Kommentare/Strings), kein Formatter im Einsatz
    "E501",
    # FastAPI-Idiom: Depends()/Query() als Default-Argument
    "B008",
    # Bewusst vorerst nicht erzwungen (bestehender Code, kein Verhaltens-Refactor in diesem Schritt)
    "B904",  # raise ... from err in except-Blöcken (HTTPException-Mapping)
]

[tool.ruff.lint.per-file-ignores]
# Imports dienen der Modell-Registrierung (Metadata) — nicht entfernen
"migrations/env.py" = ["F401"]
"tests/conftest.py" = ["F401"]
# Lambda wird synchron innerhalb der Schleife von send_to_users() aufgerufen → kein Late-Binding-Problem
"app/services/push_service.py" = ["B023"]
# TODO: erster (kaputter) Platzhalter-Test wird vom zweiten gleichnamigen überschrieben
"tests/test_chores.py" = ["F811"]
# TODO: ungenutzte Variable in Test-Setup prüfen
"tests/test_files_scoping.py" = ["F841"]

[tool.pytest.ini_options]
markers = [
    "pg: PostgreSQL-Integrationslane (tests/pg/, braucht TEST_PG_URL, sonst übersprungen)",
]
