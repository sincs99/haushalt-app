# Production Compose — eigenständig, unabhängig von docker-compose.yml (Dev)
# Nutzung: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: haushalt
      POSTGRES_USER: haushalt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Kein ports: — DB nur intern erreichbar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haushalt"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Rate-Limit-Zähler und Socket.IO-Message-Queue für mehrere Backend-Prozesse.
  # Nur flüchtige Daten (keine Persistenz, kein Volume).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    # .env.prod liefert u. a. JWT_SECRET_KEY und optional ANTHROPIC_API_KEY /
    # AI_DAILY_LIMIT_PER_HOUSEHOLD für den KI-Assistenten (leer = ausgeblendet),
    # SMTP_* für E-Mails, BILLING_ENABLED/STRIPE_* für Tarife, SENTRY_DSN
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://haushalt:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env.prod}@postgres:5432/haushalt
      UPLOAD_DIR: /app/data/uploads
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-redis://redis:6379/0}
      SOCKETIO_MESSAGE_QUEUE: ${SOCKETIO_MESSAGE_QUEUE:-redis://redis:6379/1}
      # Mehr als 1 Worker ist dank Redis möglich (CPU-Kerne beachten)
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    volumes:
      - uploaddata:/app/data/uploads
    # Kein ports: — Backend nur über Frontend-Nginx erreichbar
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: casa-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - npm
    # Kein ports: — NPM verbindet sich über das npm-Netzwerk

volumes:
  pgdata:
  uploaddata:

networks:
  npm:
    external: true
    name: "${NPM_NETWORK}"
