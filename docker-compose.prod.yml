# Production Compose — eigenständig, unabhängig von docker-compose.yml (Dev)
# Nutzung: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

# Log-Rotation für alle Container (json-file): ohne Grenze wachsen Docker-Logs unbegrenzt
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-5}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: haushalt
      POSTGRES_USER: haushalt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Kein ports: — DB nur intern erreichbar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haushalt"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    # .env.prod liefert u. a. JWT_SECRET_KEY und optional ANTHROPIC_API_KEY /
    # AI_DAILY_LIMIT_PER_HOUSEHOLD / AI_DAILY_LIMIT_PER_USER für den KI-Assistenten (leer = ausgeblendet)
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://haushalt:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env.prod}@postgres:5432/haushalt
      UPLOAD_DIR: /app/data/uploads
      # Nur dem Docker-Netz des Frontend-nginx X-Forwarded-For glauben — docs/deployment.md §2.1
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12}
    volumes:
      - uploaddata:/app/data/uploads
    # Kein ports: — Backend nur über Frontend-Nginx erreichbar
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: casa-frontend
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Netz von Nginx Proxy Manager: nur dessen X-Forwarded-For gilt als Client-IP
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    healthcheck:
      # Nur nginx selbst (ohne Backend) — Backend hat einen eigenen Healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - npm
    # Kein ports: — NPM verbindet sich über das npm-Netzwerk

volumes:
  pgdata:
  uploaddata:

networks:
  npm:
    external: true
    name: "${NPM_NETWORK}"
