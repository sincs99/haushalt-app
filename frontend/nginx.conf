# Ursprüngliches Protokoll vom vorgeschalteten Proxy (NPM terminiert TLS) übernehmen,
# sonst $scheme. Ohne das baut uvicorn Redirects mit http:// auf https://-Seiten.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Tag-Tokens (NFC/QR, Pfade /t/<token> und /api/tags/…) nicht ins Access-Log
# schreiben. Der Token allein berechtigt zu nichts (Login + Mitgliedschaft
# nötig), soll aber trotzdem nicht in Logs und Backups landen.
map $request_uri $redacted_request_uri {
    default                                                 $request_uri;
    "~^/t/[^/?#]+(?<tag_rest>.*)$"                          "/t/***$tag_rest";
    "~^/api/tags/resolve/[^/?#]+(?<tag_rest>.*)$"           "/api/tags/resolve/***$tag_rest";
    "~^/api/tags/[^/?#]+/execute(?<tag_rest>.*)$"           "/api/tags/***/execute$tag_rest";
    # Login-Redirect zurück auf den Tag (/login?redirect=/t/<token>)
    "~^(?<tag_pre>[^?]*\?(?:.*&)?redirect=(?:/|%2[Ff])t(?:/|%2[Ff]))[^&]+(?<tag_rest>.*)$" "$tag_pre***$tag_rest";
}
map $http_referer $redacted_referer {
    default                                                 $http_referer;
    "~^(?<tag_pre>https?://[^/]+/t/)[^/?#]+(?<tag_rest>.*)$" "$tag_pre***$tag_rest";
    "~^(?<tag_pre>https?://[^?]+\?(?:.*&)?redirect=(?:/|%2[Ff])t(?:/|%2[Ff]))[^&]+(?<tag_rest>.*)$" "$tag_pre***$tag_rest";
}
log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $redacted_request_uri $server_protocol" '
                    '$status $body_bytes_sent "$redacted_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Echte Client-IP: X-Forwarded-For nur von vertrauenswürdigen Proxies (NPM) übernehmen.
    # real_ip_recursive nimmt den rechtesten nicht vertrauenswürdigen Eintrag — vom
    # Client vorangestellte, gefälschte Einträge werden ignoriert. $remote_addr ist
    # danach die echte Client-IP und wird unten als einziger Wert weitergereicht.
    # Die set_real_ip_from-Zeilen erzeugt nginx/30-casa-real-ip.sh beim Start aus
    # TRUSTED_PROXY_CIDRS (Default 172.16.0.0/12) — siehe docs/deployment.md §2.1.
    include /etc/nginx/snippets/real-ip.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log redacted;

    # Healthcheck des Containers (nur nginx selbst, ohne Backend; nicht ins Access-Log)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API Reverse Proxy
    # Der Refresh-Token-Cookie (Set-Cookie casa_rt, Path=/api/auth, HttpOnly) muss hier
    # unverändert durchgereicht werden: kein proxy_hide_header Set-Cookie, kein
    # proxy_cookie_path/-domain, kein proxy_ignore_headers Set-Cookie. Der Pfad /api/auth
    # bleibt erhalten, weil proxy_pass ohne URI-Teil den Request-Pfad 1:1 weitergibt.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # KI-Assistent: Antworten der Anthropic-API brauchen teils länger als die
    # 60-s-Voreinstellung (Backend-Timeout 90 s pro Versuch, siehe docs/ai-assistant.md)
    location ~ ^/api/households/[^/]+/ai/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 200s;
    }

    # Socket.IO Reverse Proxy (mit WebSocket-Upgrade)
    location /socket.io/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400;
    }

    # Statische Assets: Langzeit-Cache (Vite hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # PWA: Service Worker + Manifest nie cachen, sonst bleiben Clients auf alten Versionen hängen
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vue Router: SPA Fallback (auch /t/<token> für NFC-/QR-Tags)
    location / {
        try_files $uri $uri/ /index.html;
        # index.html nie cachen (damit neue Deploys sofort aktiv sind)
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
