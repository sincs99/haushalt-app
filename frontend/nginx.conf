# Ursprüngliches Protokoll vom vorgeschalteten Proxy (NPM terminiert TLS) übernehmen,
# sonst $scheme. Ohne das baut uvicorn Redirects mit http:// auf https://-Seiten.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Echte Client-IP: X-Forwarded-For nur von Proxies im Docker-Netz (NPM) übernehmen.
    # real_ip_recursive nimmt den rechtesten nicht vertrauenswürdigen Eintrag — vom
    # Client vorangestellte, gefälschte Einträge werden ignoriert. $remote_addr ist
    # danach die echte Client-IP und wird unten als einziger Wert weitergereicht.
    # Andere Docker-Adress-Pools ggf. ergänzen.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # API Reverse Proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Socket.IO Reverse Proxy (mit WebSocket-Upgrade)
    location /socket.io/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400;
    }

    # Statische Assets: Langzeit-Cache (Vite hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # PWA: Service Worker + Manifest nie cachen, sonst bleiben Clients auf alten Versionen hängen
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vue Router: SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
        # index.html nie cachen (damit neue Deploys sofort aktiv sind)
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
