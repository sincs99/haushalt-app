server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Echte Client-IP (Rate-Limiting, siehe backend/app/core/rate_limit.py)
    # ---------------------------------------------------------------------
    # Kette in Produktion: Client → NPM → dieses Nginx → Backend.
    # NPM hängt die Client-IP als *letzten* Eintrag an X-Forwarded-For an;
    # alles links davon kann vom Client frei gesetzt werden.
    #
    # - set_real_ip_from: Nur Verbindungen aus privaten Netzen (Docker-
    #   Netzwerk, in dem NPM läuft) dürfen die Client-IP übergeben.
    # - real_ip_recursive off: Genau EIN Hop wird abgezogen → es zählt
    #   ausschliesslich der von NPM angehängte letzte Eintrag.  Mit "on"
    #   würden LAN-Clients mit privater IP selbst als "Proxy" gelten und ein
    #   gefälschter Eintrag weiter links würde übernommen.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from fc00::/7;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    root /usr/share/nginx/html;
    index index.html;

    # API Reverse Proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Überschreiben statt anhängen: Backend erhält genau EINE, vertrauenswürdige IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO Reverse Proxy (mit WebSocket-Upgrade)
    location /socket.io/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Überschreiben statt anhängen: Backend erhält genau EINE, vertrauenswürdige IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Statische Assets: Langzeit-Cache (Vite hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router: SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
        # index.html nie cachen (damit neue Deploys sofort aktiv sind)
        add_header Cache-Control "no-cache";
    }
}
