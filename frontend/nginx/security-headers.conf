# Security-Header für die SPA (statische Auslieferung).
#
# Wird in JEDER location mit eigenem add_header per include eingebunden —
# nginx vererbt add_header nicht in locations, die selbst add_header setzen.
# Die proxied Locations (/api/, /socket.io/) bekommen ihre Header vom Backend
# (app/core/security_headers.py) und binden diese Datei NICHT ein.
#
# CSP-Begründung (siehe docs/security/hardening-review.md):
#   script-src 'self'      — Vite-Build hat keine Inline-Skripte, kein eval
#   style-src 'self'       — CSS wird in /assets/*.css extrahiert; Vue :style nutzt CSSOM
#   img-src data: blob:    — Datei-Vorschauen laufen über URL.createObjectURL
#   connect-src wss://$host — Socket.IO-WebSocket (ältere Safari matchen 'self' nicht auf wss)
#   worker-src 'self'      — Service Worker (sw.js, workbox-*.js, push-sw.js)
# HSTS setzt der TLS-Terminator (Nginx Proxy Manager), nicht dieser Container.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://$host; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
