# Security-Header für die SPA (statische Auslieferung).
#
# Wird in JEDER location mit eigenem add_header per include eingebunden —
# nginx vererbt add_header nicht in locations, die selbst add_header setzen.
# Die proxied Locations (/api/, /socket.io/) bekommen ihre Header vom Backend
# (app/core/security_headers.py) und binden diese Datei NICHT ein.
#
# CSP-Begründung (siehe docs/security/hardening-review.md):
#   script-src 'self'      — Vite-Build hat keine Inline-Skripte, kein eval
#   style-src 'self'       — CSS wird in /assets/*.css extrahiert; Vue :style nutzt CSSOM
#   style-src-attr 'unsafe-inline' — nur style=""-Attribute. Der PDF-Betrachter im Blob-iframe erbt
#                            die CSP der Seite und setzt Inline-Styles; ohne diese Ausnahme
#                            kollabiert seine Ansicht auf einen schmalen Streifen. <style>-Blöcke
#                            bleiben durch style-src 'self' gesperrt.
#   img-src data: blob:    — Bild-Vorschauen laufen über URL.createObjectURL
#   frame-src blob:        — PDF-Vorschau (Dokumente) ist ein <iframe> auf eine Blob-URL;
#                            ohne frame-src greift default-src 'self', das blob: nicht erlaubt
#   connect-src wss://$host — Socket.IO-WebSocket (ältere Safari matchen 'self' nicht auf wss)
#   worker-src 'self'      — Service Worker (sw.js, workbox-*.js, push-sw.js)
# HSTS setzt der TLS-Terminator (Nginx Proxy Manager), nicht dieser Container.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; frame-src blob:; connect-src 'self' wss://$host; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
